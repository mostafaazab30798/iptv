name: Daily Yallakora Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC
    - cron: '0 12 * * *' # Midday UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper/scraper.py

      - name: Commit and Push matches.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sports): auto-update daily matches.json" && git push)
