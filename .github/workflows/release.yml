name: Release Android & Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (stable, beta, internal)"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - internal
      mandatory_update:
        description: "Mark as mandatory update"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Extract Version & Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      channel: ${{ steps.meta.outputs.channel }}
      mandatory: ${{ steps.meta.outputs.mandatory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version and build number from pubspec.yaml
        id: meta
        run: |
          RAW_VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//')
          VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$RAW_VERSION" | grep '+' | cut -d'+' -f2 || echo "")
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi

          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          MANDATORY="${{ github.event.inputs.mandatory_update || 'false' }}"
          TAG_NAME="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "mandatory=${MANDATORY}" >> "$GITHUB_OUTPUT"

          echo "Extracted: Version=${VERSION}, Build=${BUILD_NUM}, Tag=${TAG_NAME}, Channel=${CHANNEL}"

  build-android:
    name: Build & Publish Android Release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run commercial validation tests
        run: flutter test test/commercial/

      - name: Build split release APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BUILD_ARGS="--release --split-per-abi"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi
          flutter build apk $BUILD_ARGS

      - name: Prepare Android artifact & compute metadata
        id: artifact
        run: |
          mkdir -p dist/android
          TARGET_FILE="dist/android/HOPE_IPTV.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$TARGET_FILE"
          
          FILE_SIZE=$(stat -c%s "$TARGET_FILE")
          SHA256_HASH=$(sha256sum "$TARGET_FILE" | awk '{print $1}')

          echo "file_name=HOPE_IPTV.apk" >> "$GITHUB_OUTPUT"
          echo "file_path=${TARGET_FILE}" >> "$GITHUB_OUTPUT"
          echo "file_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"

          echo "Android APK: size=${FILE_SIZE} bytes, sha256=${SHA256_HASH}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: HOPE TV ${{ needs.version.outputs.tag_name }}
          draft: false
          prerelease: ${{ needs.version.outputs.channel != 'stable' }}
          body: |
            ## HOPE TV Release ${{ needs.version.outputs.version }} (Build ${{ needs.version.outputs.build_number }})
            
            - **Channel**: `${{ needs.version.outputs.channel }}`
            - **Commit**: `${{ github.sha }}`
            
            ### Artifacts
            - **Android APK (arm64-v8a)**: `HOPE_IPTV.apk`
              - SHA-256: `${{ steps.artifact.outputs.sha256 }}`
              - Size: `${{ steps.artifact.outputs.file_size }} bytes`
          files: ${{ steps.artifact.outputs.file_path }}
          fail_on_unmatched_files: true

      - name: Register Android release in Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OBJECT_KEY="https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag_name }}/${{ steps.artifact.outputs.file_name }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          PAYLOAD=$(cat <<EOF
          {
            "platform": "android",
            "architecture": "arm64-v8a",
            "channel": "${{ needs.version.outputs.channel }}",
            "version": "${{ needs.version.outputs.version }}",
            "build_number": ${{ needs.version.outputs.build_number }},
            "object_key": "${OBJECT_KEY}",
            "file_size_bytes": ${{ steps.artifact.outputs.file_size }},
            "sha256": "${{ steps.artifact.outputs.sha256 }}",
            "mandatory_update": ${{ needs.version.outputs.mandatory }},
            "published_at": "${NOW}"
          }
          EOF
          )

          curl -s -X POST "${SUPABASE_URL}/rest/v1/release_versions" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "$PAYLOAD"

          echo "Registered Android release in Supabase database."

  build-windows:
    name: Build & Publish Windows Release
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: pwsh
        run: |
          $buildArgs = @("--release")
          if ($env:SUPABASE_URL -and $env:SUPABASE_ANON_KEY) {
            $buildArgs += "--dart-define=SUPABASE_URL=$($env:SUPABASE_URL)"
            $buildArgs += "--dart-define=SUPABASE_ANON_KEY=$($env:SUPABASE_ANON_KEY)"
          }
          flutter build windows @buildArgs

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Windows Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" "installer\windows\hope_iptv.iss"

      - name: Prepare Windows artifact & compute metadata
        id: artifact
        shell: pwsh
        run: |
          $installerPath = "dist\windows\HOPE IPTV.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer was not created at $installerPath"
          }
          $renamed = "dist\windows\HOPE_IPTV_Setup.exe"
          Copy-Item -Path $installerPath -Destination $renamed -Force

          $hash = (Get-FileHash -Path $renamed -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $renamed).Length

          echo "file_name=HOPE_IPTV_Setup.exe" >> $env:GITHUB_OUTPUT
          echo "file_path=$renamed" >> $env:GITHUB_OUTPUT
          echo "file_size=$size" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

          Write-Host "Windows Installer: size=$size bytes, sha256=$hash"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: HOPE TV ${{ needs.version.outputs.tag_name }}
          draft: false
          prerelease: ${{ needs.version.outputs.channel != 'stable' }}
          files: ${{ steps.artifact.outputs.file_path }}
          fail_on_unmatched_files: true

      - name: Register Windows release in Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: pwsh
        run: |
          $objectKey = "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag_name }}/${{ steps.artifact.outputs.file_name }}"
          $now = [DateTime]::UtcNow.ToString("o")

          $payload = @{
            platform = "windows"
            architecture = "x64"
            channel = "${{ needs.version.outputs.channel }}"
            version = "${{ needs.version.outputs.version }}"
            build_number = [int]"${{ needs.version.outputs.build_number }}"
            object_key = $objectKey
            file_size_bytes = [long]"${{ steps.artifact.outputs.file_size }}"
            sha256 = "${{ steps.artifact.outputs.sha256 }}"
            mandatory_update = [bool]::Parse("${{ needs.version.outputs.mandatory }}")
            published_at = $now
          } | ConvertTo-Json

          $headers = @{
            "apikey" = $env:SUPABASE_SERVICE_ROLE_KEY
            "Authorization" = "Bearer $($env:SUPABASE_SERVICE_ROLE_KEY)"
            "Content-Type" = "application/json"
            "Prefer" = "resolution=merge-duplicates"
          }

          Invoke-RestMethod -Uri "$($env:SUPABASE_URL)/rest/v1/release_versions" -Method Post -Headers $headers -Body $payload
          Write-Host "Registered Windows release in Supabase database."
