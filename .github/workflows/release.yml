name: Release Android & Windows

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_suffix: ${{ steps.meta.outputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: meta
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${VERSION}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename arm64-v8a APK
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/HOPE IPTV.apk"
          ls -lh dist/android/

      - name: Publish Android GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ needs.version.outputs.tag_suffix }}
          name: Android — HOPE IPTV v${{ needs.version.outputs.version }}
          body: |
            Android release build (arm64-v8a).

            - App: **HOPE IPTV**
            - Version: `${{ needs.version.outputs.version }}`
            - Commit: `${{ github.sha }}`
          files: dist/android/HOPE IPTV.apk
          fail_on_unmatched_files: true
          make_latest: false

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" "installer\windows\hope_iptv.iss"
          Get-ChildItem dist\windows | Format-Table Name, Length

      - name: Publish Windows GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ needs.version.outputs.tag_suffix }}
          name: Windows — HOPE IPTV v${{ needs.version.outputs.version }}
          body: |
            Windows installer release.

            - App: **HOPE IPTV**
            - Version: `${{ needs.version.outputs.version }}`
            - Commit: `${{ github.sha }}`
          files: dist/windows/HOPE IPTV.exe
          fail_on_unmatched_files: true
          make_latest: false
