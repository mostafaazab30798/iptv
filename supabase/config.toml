# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "hope-tv"

[api]
enabled = true
port = 54321
schemas = ["public", "analytics", "private", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://hope-tv.site"
additional_redirect_urls = [
  "https://hope-tv.site/**",
  "https://www.hope-tv.site/**",
  "https://admin.hope-tv.site/**",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
# Passwordless OTP / magic link — production SMTP configured later via OWNER_CONFIG placeholders.
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "رمز تسجيل الدخول إلى HOPE TV"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# Public operational metadata endpoints. All account, entitlement, analytics,
# device, trial, and admin functions retain gateway JWT verification.
[functions.health]
verify_jwt = false

[functions.version]
verify_jwt = false

[functions.downloads]
verify_jwt = true

[functions.download-consume]
verify_jwt = false

[functions.account-deletion]
verify_jwt = true

[functions.account-deletion-processor]
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"
